<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat with {{ other_user.username }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .chat-box {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
        .message {
            margin-bottom: 8px;
        }
        .message.you {
            text-align: right;
            color: blue;
        }
        .message.other {
            text-align: left;
            color: green;
        }
        input[type="text"] {
            width: 80%;
            padding: 8px;
        }
        button {
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <h2>Chat with {{ other_user.username }}</h2>

    <div class="chat-box" id="chat-box">
        {% for m in messages %}
            <div class="message {% if m.sender == request.user %}you{% else %}other{% endif %}">
                <strong>{{ m.sender.username }}:</strong> {{ m.text }}
            </div>
        {% empty %}
            <p>No messages yet.</p>
        {% endfor %}
    </div>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="message" placeholder="Type your message..." autocomplete="off" required>
        <button type="submit">Send</button>
    </form>

    <p><a href="{% url 'user_list' %}">Back to Users</a></p>

    <script>
        // Auto-scroll to bottom
        var chatBox = document.getElementById('chat-box');
        chatBox.scrollTop = chatBox.scrollHeight;
    </script>
</body>
</html>
